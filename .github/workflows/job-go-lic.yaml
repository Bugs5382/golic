name: GoLic
# Pull requests only, and not while the PR is a draft. There is no push trigger:
# the PR run already tested the tree being merged, so nothing reruns on push to
# a branch or to main.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  GoLic:
    name: GoLic
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: GoLic
        run: |
          go build -o ./bin/golic ./cmd/golic
          # -x exits 1 when a header is missing, so the job fails instead of
          # only logging it. Errors exit 2.
          ./bin/golic inject -c "2026 Shane & Contributors" -t apache2 -d -x
